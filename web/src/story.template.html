<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
{{FONTS_CSS}}
html,body{margin:0;background:#121B37;}
</style>
</head>
<body>
<div id="stage"></div>
<script>window.DATA_STORY_PRODUCTION = {{PRODUCTION_JSON}};</script>
<script>
{{ENGINE_JS}}
</script>
<script>
(function(){
  // Story player: every scene of the production JSON on ONE master clock (seconds).
  // Scene i is visible for start_ms <= T < start_ms + duration_ms. Handoffs are declared on the
  // outgoing scene (transition.type 'crossfade' | 'cut', transition.duration_ms) and rendered as a
  // content fade-out of that scene plus a content fade-in of the next one over a shared background.
  const q = new URLSearchParams(location.search);
  const prod = window.DATA_STORY_PRODUCTION;
  window.__frameReady = false; window.__pageError = null;
  window.addEventListener('unhandledrejection', e => { window.__pageError = String(e.reason && (e.reason.message || e.reason)); });
  window.addEventListener('error', e => { window.__pageError = String(e.message); });
  window.DataStoryEngine.ready().then(() => {
    const player = window.DataStoryEngine.mountStory(document.getElementById('stage'), prod);
    window.dataStory = player;
    if (q.has('t')) { player.render(+q.get('t')); window.__frameReady = true; return; }
    const t0 = performance.now();
    (function loop(){ player.render(((performance.now() - t0) / 1000) % player.duration); window.__frameReady = true; requestAnimationFrame(loop); })();
  });
})();
</script>
</body>
</html>
