03BD\u03C4\u03B1 \u03AD\u03BE\u03B9. \u039A\u03B1\u03B9 \u03C4\u03BF \u03B5\u03AF\u03BA\u03BF\u03C3\u03B9 \u03C4\u03AD\u03C3\u03C3\u03B5\u03C1\u03B1, \u03B7 \u03C5\u03C8\u03B7\u03BB\u03CC\u03C4\u03B5\u03C1\u03B7 \u03BC\u03B1\u03BA\u03C1\u03BF\u03C7\u03C1\u03CC\u03BD\u03B9\u03B1 \u03B1\u03BD\u03B5\u03C1\u03B3\u03AF\u03B1 \u03C3\u03C4\u03B7\u03BD \u0388\u03BD\u03C9\u03C3\u03B7: \u03C0\u03AD\u03BD\u03C4\u03B5 \u03BA\u03CC\u03BC\u03BC\u03B1 \u03C4\u03AD\u03C3\u03C3\u03B5\u03C1\u03B1 \u03C4\u03BF\u03B9\u03C2 \u03B5\u03BA\u03B1\u03C4\u03CC. [pause] \u0397 \u03B1\u03BD\u03B5\u03C1\u03B3\u03AF\u03B1 \u03C0\u03AD\u03C6\u03C4\u03B5\u03B9. \u039B\u03CD\u03B8\u03B7\u03BA\u03B5 \u03C4\u03BF \u03C0\u03C1\u03CC\u03B2\u03BB\u03B7\u03BC\u03B1; \u0393\u03C1\u03AC\u03C8\u03B5 \u03BC\u03B1\u03C2 \u03C4\u03B7 \u03B3\u03BD\u03CE\u03BC\u03B7 \u03C3\u03BF\u03C5 \u03C3\u03C4\u03B1 \u03C3\u03C7\u03CC\u03BB\u03B9\u03B1.", "vo_b": "\u0395\u03C0\u03C4\u03AC \u03BA\u03CC\u03BC\u03BC\u03B1 \u03B5\u03BD\u03BD\u03AD\u03B1 \u03C4\u03BF\u03B9\u03C2 \u03B5\u03BA\u03B1\u03C4\u03CC \u03B7 \u03B1\u03BD\u03B5\u03C1\u03B3\u03AF\u03B1 \u03C3\u03C4\u03B7\u03BD \u0395\u03BB\u03BB\u03AC\u03B4\u03B1 \u03C4\u03BF\u03BD \u0399\u03BF\u03CD\u03BB\u03B9\u03BF \u03C4\u03BF\u03C5 \u03B5\u03AF\u03BA\u03BF\u03C3\u03B9 \u03AD\u03BE\u03B9. \u03A3\u03C4\u03B7\u03BD \u0395\u03C5\u03C1\u03C9\u03C0\u03B1\u03CA\u03BA\u03AE \u0388\u03BD\u03C9\u03C3\u03B7, \u03AD\u03BE\u03B9 \u03BA\u03CC\u03BC\u03BC\u03B1 \u03AD\u03BD\u03B1. \u03A0\u03AD\u03C1\u03C3\u03B9 \u03AE\u03C4\u03B1\u03BD \u03BF\u03BA\u03C4\u03CE \u03BA\u03CC\u03BC\u03BC\u03B1 \u03B5\u03BD\u03BD\u03AD\u03B1. \u039C\u03AF\u03B1 \u03C0\u03BF\u03C3\u03BF\u03C3\u03C4\u03B9\u03B1\u03AF\u03B1 \u03BC\u03BF\u03BD\u03AC\u03B4\u03B1 \u03BA\u03AC\u03C4\u03C9. \u03A4\u03C1\u03B9\u03B1\u03BA\u03CC\u03C3\u03B9\u03B5\u03C2 \u03B5\u03B2\u03B4\u03BF\u03BC\u03AE\u03BD\u03C4\u03B1 \u03AD\u03BE\u03B9 \u03C7\u03B9\u03BB\u03B9\u03AC\u03B4\u03B5\u03C2 \u03C0\u03B5\u03BD\u03C4\u03B1\u03BA\u03CC\u03C3\u03B9\u03BF\u03B9 \u03BF\u03BA\u03C4\u03CE \u03AC\u03BD\u03B5\u03C1\u03B3\u03BF\u03B9. \u03A3\u03B1\u03C1\u03AC\u03BD\u03C4\u03B1 \u03C0\u03AD\u03BD\u03C4\u03B5 \u03C7\u03B9\u03BB\u03B9\u03AC\u03B4\u03B5\u03C2 \u03BB\u03B9\u03B3\u03CC\u03C4\u03B5\u03C1\u03BF\u03B9. \u03A3\u03C4\u03B1 \u03B5\u03BA\u03B1\u03C4\u03CC \u03AC\u03C4\u03BF\u03BC\u03B1 \u03B4\u03B5\u03BA\u03B1\u03C0\u03AD\u03BD\u03C4\u03B5 \u03AD\u03C9\u03C2 \u03B5\u03B2\u03B4\u03BF\u03BC\u03AE\u03BD\u03C4\u03B1 \u03C4\u03B5\u03C3\u03C3\u03AC\u03C1\u03C9\u03BD, \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 \u03C0\u03B5\u03BD\u03AE\u03BD\u03C4\u03B1 \u03B5\u03C0\u03C4\u03AC \u03B5\u03C1\u03B3\u03AC\u03B6\u03BF\u03BD\u03C4\u03B1\u03B9, \u03C0\u03AD\u03BD\u03C4\u03B5 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03AC\u03BD\u03B5\u03C1\u03B3\u03BF\u03B9, \u03C4\u03C1\u03B9\u03AC\u03BD\u03C4\u03B1 \u03BF\u03BA\u03C4\u03CE \u03B5\u03BA\u03C4\u03CC\u03C2 \u03B5\u03C1\u03B3\u03B1\u03C4\u03B9\u03BA\u03BF\u03CD \u03B4\u03C5\u03BD\u03B1\u03BC\u03B9\u03BA\u03BF\u03CD. \u03A3\u03C4\u03BF\u03C5\u03C2 \u03BD\u03AD\u03BF\u03C5\u03C2, \u03B4\u03B5\u03BA\u03B1\u03AD\u03BE\u03B9 \u03BA\u03CC\u03BC\u03BC\u03B1 \u03BF\u03BA\u03C4\u03CE \u03C4\u03BF\u03B9\u03C2 \u03B5\u03BA\u03B1\u03C4\u03CC, \u03AD\u03BD\u03B1\u03BD\u03C4\u03B9 \u03B4\u03B5\u03BA\u03B1\u03C0\u03AD\u03BD\u03C4\u03B5 \u03BA\u03CC\u03BC\u03BC\u03B1 \u03AD\u03BD\u03B1 \u03C3\u03C4\u03B7\u03BD \u0388\u03BD\u03C9\u03C3\u03B7. \u0393\u03B9\u03B1 \u03CC\u03BB\u03BF \u03C4\u03BF \u03B5\u03AF\u03BA\u03BF\u03C3\u03B9 \u03C0\u03AD\u03BD\u03C4\u03B5, \u03C4\u03C1\u03AF\u03C4\u03BF \u03C5\u03C8\u03B7\u03BB\u03CC\u03C4\u03B5\u03C1\u03BF \u03C0\u03BF\u03C3\u03BF\u03C3\u03C4\u03CC \u03C3\u03C4\u03B7\u03BD \u0388\u03BD\u03C9\u03C3\u03B7, \u03C0\u03AF\u03C3\u03C9 \u03B1\u03C0\u03CC \u0399\u03C3\u03C0\u03B1\u03BD\u03AF\u03B1 \u03BA\u03B1\u03B9 \u03A6\u03B9\u03BD\u03BB\u03B1\u03BD\u03B4\u03AF\u03B1. \u0391\u03BB\u03BB\u03AC \u03BA\u03B1\u03B9 \u03B7 \u03BC\u03B5\u03B3\u03B1\u03BB\u03CD\u03C
